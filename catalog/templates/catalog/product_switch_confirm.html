{% extends 'catalog/base.html' %}

{% block content %}

<div class="container">
    <div class="row mt-5">
        <div class="col-3"></div>

        <div class="col-6">
            <h1>Желаете сменить признак публикации "{{product.name}}" ?</h1>
            <form method="post">
                {% csrf_token %}
                <button class="btn btn-success" type="submit">Изменить</button>
                <a href="{% url 'catalog:home' %}" class="btn btn-danger">Назад</a>
            </form>



        </div>

        <div class="col-3"></div>
    </div>

</div>


{% endblock %}
